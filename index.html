<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desert Ants — 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    color: rgba(255,248,235,.55); font: 13px/1.5 system-ui, sans-serif;
    user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  #hud b { color: #ffd9a0; font-weight: 600; letter-spacing: .04em; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
}}
</script>
</head>
<body>
<div id="hud"><b>DESERT ANTS</b> &nbsp;·&nbsp; drag to orbit · scroll to zoom · <span id="gpu"></span> · brightness <input id="bright" type="range" min="0.6" max="1.8" step="0.05" value="1.05" style="vertical-align:middle"></div>
<div id="err" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:#ffd9a0;font:15px/1.6 system-ui,sans-serif;background:#1a1208;padding:24px;text-align:center"></div>
<script>
function showErr(msg) {
  const box = document.getElementById('err');
  box.style.display = 'flex';
  box.textContent = msg;
}
addEventListener('error', e => showErr('Failed to start the 3D scene: ' + (e.message || 'unknown error')));
if (location.protocol === 'file:') {
  showErr('This page was opened as a local file, which blocks ES modules. Serve it instead: run `python3 -m http.server 8321` in the folder and open http://localhost:8321');
} else {
  const probe = document.createElement('canvas');
  const gl = probe.getContext('webgl2') || probe.getContext('webgl');
  if (!gl) {
    showErr('WebGL is not available in this browser. Enable hardware acceleration (Chrome: Settings → System → "Use graphics acceleration when available"; Firefox: about:support → "WebGL Driver"), then reload.');
  } else {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    setTimeout(() => {
      const g = document.getElementById('gpu');
      if (g) g.textContent = 'GPU: ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'WebGL ok');
    }, 100);
  }
}
setTimeout(() => {
  if (!window.__antsReady) showErr('The 3D scene did not start. Your browser may not support WebGL, or module loading was blocked. Try Chrome/Firefox with hardware acceleration enabled.');
}, 4000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ---------- helpers ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1337);

/* ---------- terrain height (dunes + ripples) ---------- */
function terrainHeight(x, z) {
  let y = 0;
  y += 2.4 * Math.sin(x * 0.055) * Math.cos(z * 0.048);          // big dunes
  y += 1.0 * Math.sin(x * 0.14 + 1.7) * Math.sin(z * 0.12 + 0.6); // medium dunes
  y += 0.5 * Math.cos(x * 0.31 - z * 0.22 + 2.1);                 // cross ripples
  y += 0.14 * Math.sin(x * 1.1) * Math.sin(z * 0.95);             // fine ripples
  return y;
}

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('bright').addEventListener('input', e => {
  renderer.toneMappingExposure = +e.target.value;
});
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf0d5a4, 70, 300);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(64, 5.5, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 6;
controls.maxDistance = 140;
controls.maxPolarAngle = 1.52;

/* ---------- sky + sun ---------- */
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 10;
skyU.rayleigh.value = 1.4;
skyU.mieCoefficient.value = 0.009;
skyU.mieDirectionalG.value = 0.86;
const sunDir = new THREE.Vector3().setFromSphericalCoords(
  1, THREE.MathUtils.degToRad(58), THREE.MathUtils.degToRad(135)
);
skyU.sunPosition.value.copy(sunDir);

const sunLight = new THREE.DirectionalLight(0xffd9a3, 3.4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
const sc = sunLight.shadow.camera;
sc.left = sc.bottom = -14; sc.right = sc.top = 14; sc.near = 10; sc.far = 120;
sunLight.shadow.bias = -0.0006;
scene.add(sunLight, sunLight.target);

scene.add(new THREE.HemisphereLight(0xcfe4ff, 0xb98a55, 0.55));

/* ---------- sand texture ---------- */
function makeSandTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 70000; i++) {
    const v = 190 + Math.random() * 65 | 0;
    g.fillStyle = `rgb(${v},${v - 8},${v - 28})`;
    g.fillRect(Math.random() * 512, Math.random() * 512, 1, 1);
  }
  g.globalAlpha = 0.10;
  for (let i = 0; i < 40; i++) {
    g.strokeStyle = i % 2 ? '#8a6a3d' : '#fff6dd';
    g.lineWidth = 1 + Math.random() * 2;
    g.beginPath();
    const y0 = Math.random() * 512;
    for (let x = 0; x <= 512; x += 8)
      g.lineTo(x, y0 + Math.sin(x * 0.05 + i) * 6);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(70, 70);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- terrain mesh ---------- */
const SIZE = 420;
const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, 240, 240);
terrainGeo.rotateX(-Math.PI / 2);
{
  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const low = new THREE.Color(0xc89a5e), high = new THREE.Color(0xf5dcae);
  const col = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainHeight(x, z);
    pos.setY(i, h);
    const t = THREE.MathUtils.clamp((h + 3) / 6.5, 0, 1);
    col.copy(low).lerp(high, t * t);
    colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();
}
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
  map: makeSandTexture(), vertexColors: true, roughness: 0.96, metalness: 0
}));
terrain.receiveShadow = true;
scene.add(terrain);

/* ---------- props: rocks + cacti (kept off the ant trail) ---------- */
const TRAIL_R = 55; // caravan circle radius
function nearTrail(x, z) {
  const r = Math.hypot(x, z);
  return r > TRAIL_R - 9 && r < TRAIL_R + 9;
}
const rockMat = new THREE.MeshStandardMaterial({ color: 0x9c8468, roughness: 0.9, flatShading: true });
for (let i = 0; i < 40; i++) {
  const a = rand() * Math.PI * 2, r = 12 + rand() * 150;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (nearTrail(x, z)) continue;
  const s = 0.4 + rand() * 2.2;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
  rock.position.set(x, terrainHeight(x, z) - s * 0.25, z);
  rock.rotation.set(rand() * 3, rand() * 3, rand() * 3);
  rock.scale.y = 0.6 + rand() * 0.4;
  rock.castShadow = rock.receiveShadow = true;
  scene.add(rock);
}
const cactusMat = new THREE.MeshStandardMaterial({ color: 0x55803f, roughness: 0.8 });
function addCactus(x, z, h) {
  const g = new THREE.Group();
  const y0 = terrainHeight(x, z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.12, h * 0.15, h, 10), cactusMat);
  trunk.position.y = h / 2;
  g.add(trunk);
  for (const side of [-1, 1]) {
    if (rand() < 0.25) continue;
    const ah = h * (0.35 + rand() * 0.3);
    const arm = new THREE.Group();
    const horiz = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.08, h * 0.08, h * 0.22, 8), cactusMat);
    horiz.rotation.z = Math.PI / 2;
    horiz.position.x = side * h * 0.15;
    arm.add(horiz);
    const up = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.075, h * 0.08, ah, 8), cactusMat);
    up.position.set(side * h * 0.26, ah / 2, 0);
    arm.add(up);
    arm.position.y = h * (0.35 + rand() * 0.3);
    g.add(arm);
  }
  g.position.set(x, y0, z);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g);
}
for (let i = 0; i < 14; i++) {
  const a = rand() * Math.PI * 2, r = 15 + rand() * 140;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (nearTrail(x, z)) continue;
  addCactus(x, z, 2 + rand() * 4);
}

/* ---------- drifting wind-blown sand ---------- */
const dustN = 900;
const dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) {
  dustPos[i * 3] = (rand() - 0.5) * 180;
  dustPos[i * 3 + 1] = rand() * 9;
  dustPos[i * 3 + 2] = (rand() - 0.5) * 180;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xffe9c2, size: 0.09, transparent: true, opacity: 0.35,
  depthWrite: false, sizeAttenuation: true
}));
scene.add(dust);

/* ---------- ant ---------- */
const geoHead = new THREE.SphereGeometry(0.30, 20, 16);
const geoThorax = new THREE.SphereGeometry(0.30, 20, 16);
const geoAbdomen = new THREE.SphereGeometry(0.50, 22, 16);
const geoPetiole = new THREE.SphereGeometry(0.10, 10, 8);
const geoEye = new THREE.SphereGeometry(0.07, 10, 8);
const geoMandible = new THREE.ConeGeometry(0.05, 0.20, 6);
const geoUpper = new THREE.CylinderGeometry(0.030, 0.024, 0.42, 6);
geoUpper.translate(0, -0.21, 0);
const geoTibia = new THREE.CylinderGeometry(0.024, 0.017, 0.46, 6);
geoTibia.translate(0, -0.23, 0);
const geoFoot = new THREE.SphereGeometry(0.035, 6, 5);
const geoAntenna = new THREE.CylinderGeometry(0.012, 0.008, 0.55, 5);
geoAntenna.translate(0, 0.275, 0);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x120a06, roughness: 0.3 });

class Ant {
  constructor(colorHex, scale) {
    this.group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.55 });

    const add = (geo, m, x, y, z, sx = 1, sy = 1, sz = 1) => {
      const mesh = new THREE.Mesh(geo, m);
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      mesh.castShadow = true;
      this.group.add(mesh);
      return mesh;
    };

    add(geoAbdomen, mat, 0, 0.62, -0.78, 0.66, 0.60, 0.92);
    add(geoPetiole, mat, 0, 0.56, -0.30);
    add(geoThorax, mat, 0, 0.58, 0.02, 0.85, 0.80, 1.15);
    const head = add(geoHead, mat, 0, 0.55, 0.62, 1.0, 0.95, 1.0);
    add(geoEye, eyeMat, 0.17, 0.63, 0.80);
    add(geoEye, eyeMat, -0.17, 0.63, 0.80);
    const mR = add(geoMandible, mat, 0.10, 0.46, 0.92);
    mR.rotation.set(2.1, 0, -0.35);
    const mL = add(geoMandible, mat, -0.10, 0.46, 0.92);
    mL.rotation.set(2.1, 0, 0.35);

    // antennae
    this.antennae = [];
    for (const side of [-1, 1]) {
      const ant = new THREE.Group();
      ant.position.set(side * 0.12, 0.72, 0.85);
      const rod = new THREE.Mesh(geoAntenna, mat);
      rod.castShadow = true;
      ant.add(rod);
      ant.rotation.x = 0.9;
      ant.rotation.z = side * 0.45;
      this.group.add(ant);
      this.antennae.push({ obj: ant, side });
    }

    // legs — tripod gait: alternating phase groups
    this.legs = [];
    const legDefs = [
      { side: 1, z: 0.24, ph: 0 },   // right front
      { side: -1, z: 0.0, ph: 0 },   // left middle
      { side: 1, z: -0.22, ph: 0 },  // right back
      { side: -1, z: 0.24, ph: Math.PI }, // left front
      { side: 1, z: 0.0, ph: Math.PI },  // right middle
      { side: -1, z: -0.22, ph: Math.PI } // left back
    ];
    for (const d of legDefs) {
      const hip = new THREE.Group();
      hip.position.set(d.side * 0.17, 0.62, d.z);
      const upper = new THREE.Mesh(geoUpper, mat);
      upper.rotation.z = d.side * 1.05;
      upper.castShadow = true;
      hip.add(upper);
      const knee = new THREE.Group();
      knee.position.set(d.side * 0.42 * Math.sin(1.05), -0.42 * Math.cos(1.05), 0);
      const tibia = new THREE.Mesh(geoTibia, mat);
      tibia.rotation.z = d.side * 0.35;
      tibia.castShadow = true;
      knee.add(tibia);
      const foot = new THREE.Mesh(geoFoot, mat);
      foot.position.set(d.side * 0.46 * Math.sin(0.35), -0.46 * Math.cos(0.35), 0);
      knee.add(foot);
      hip.add(knee);
      this.group.add(hip);
      this.legs.push({ hip, knee, ph: d.ph });
    }

    this.head = head;
    this.group.scale.setScalar(scale);
    scene.add(this.group);
  }

  update(t, speed) {
    const p = t * speed * 16;
    for (const L of this.legs) {
      const a = p + L.ph;
      L.hip.rotation.x = 0.55 * Math.sin(a);
      L.hip.rotation.z = (L.hip.position.x > 0 ? 1 : -1) * Math.max(0, Math.sin(a)) * 0.22;
      L.knee.rotation.x = -0.55 - 0.6 * Math.cos(a);
    }
    for (const A of this.antennae) {
      A.obj.rotation.y = Math.sin(p * 0.5 + A.side) * 0.25;
      A.obj.rotation.x = 0.9 + Math.sin(p * 0.8 + A.side * 2) * 0.1;
    }
    this.head.rotation.y = Math.sin(p * 0.25) * 0.12;
    return 0.02 * Math.sin(p); // body bob
  }
}

/* ---------- caravan on a circular route across the dunes ---------- */
function trailPoint(theta) {
  const r = TRAIL_R + 6 * Math.sin(theta * 3) + 2 * Math.sin(theta * 7.3 + 1);
  return new THREE.Vector3(Math.cos(theta) * r, 0, Math.sin(theta) * r);
}

const ants = [];
const N = 10;
const colors = [0x7a4022, 0x8a4d28, 0x63331a, 0x93562e];
for (let i = 0; i < N; i++) {
  const a = new Ant(colors[i % colors.length], 0.85 + rand() * 0.35);
  ants.push(a);
}

// the leaf-cutter: ant #3 carries a green leaf overhead
{
  const carrier = ants[3];
  const leaf = new THREE.Mesh(
    new THREE.CircleGeometry(0.6, 12),
    new THREE.MeshStandardMaterial({ color: 0x557f2e, roughness: 0.7, side: THREE.DoubleSide })
  );
  leaf.scale.set(1, 1.5, 1);
  leaf.rotation.set(-1.15, 0.4, 0.2);
  leaf.position.set(0.1, 1.35, 0.35);
  leaf.castShadow = true;
  carrier.group.add(leaf);
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, 0.5, 5),
    new THREE.MeshStandardMaterial({ color: 0x6b8f3a, roughness: 0.8 })
  );
  stem.position.set(0.05, 1.0, 0.55);
  stem.rotation.x = 0.5;
  carrier.group.add(stem);
}

const SPEED = 0.55;              // world units / second
let travelled = 0;               // arc length of the lead ant
const spacing = 2.6;             // gap between ants along the trail
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
const smoothedTarget = new THREE.Vector3(TRAIL_R, 1, 0);

/* ---------- animation loop ---------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  window.__antsReady = true;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  travelled += SPEED * dt;

  const leadTheta = travelled / TRAIL_R;

  ants.forEach((ant, i) => {
    const theta = (travelled - i * spacing) / TRAIL_R;
    const p = trailPoint(theta);
    const ahead = trailPoint(theta + 0.02);
    const gy = terrainHeight(p.x, p.z);
    const bob = ant.update(t + i * 0.37, SPEED);
    ant.group.position.set(p.x, gy + 0.06 + bob, p.z);
    ant.group.rotation.y = Math.atan2(ahead.x - p.x, ahead.z - p.z);
    ant.group.rotation.z = Math.sin(trailPoint(theta - 0.02).x) * 0.02;
  });

  // shadow light follows the lead ant for crisp close-up shadows
  sunLight.position.copy(ants[0].group.position).addScaledVector(sunDir, 60);
  sunLight.target.position.copy(ants[0].group.position);
  sunLight.target.updateMatrixWorld();

  // wind-blown sand drifts and wraps
  const dp = dustGeo.attributes.position.array;
  for (let i = 0; i < dustN; i++) {
    dp[i * 3] += dt * (1.2 + (i % 5) * 0.3);
    dp[i * 3 + 1] += Math.sin(t * 2 + i) * dt * 0.15;
    if (dp[i * 3] > 90) dp[i * 3] -= 180;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // camera keeps the caravan framed while slowly orbiting
  smoothedTarget.lerp(tmpA.copy(ants[Math.floor(N / 3)].group.position).setY(
    tmpB.copy(ants[Math.floor(N / 3)].group.position).y + 1.2
  ), 0.04);
  controls.target.copy(smoothedTarget);
  controls.update();

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
